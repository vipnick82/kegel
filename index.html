<!DOCTYPE html>
<html lang="bg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kegel Trainer</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kegel">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
  :root{
    --bg:#08090c; --card:#12151b; --card2:#1a1e26; --line:#272c36;
    --txt:#f2f4f8;
    --dim:#a3adbe;        /* вторичен текст - изсветлен за четимост на телефон */
    --dim2:#8891a1;       /* най-тихият текст */
    --accent:#22c55e;
    /* радиуси - едно място за всички */
    --r-lg:18px; --r-md:14px; --r-sm:12px; --r-pill:99px; --r-sheet:22px;
    --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
  .screen{display:none;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 40px);animation:fade .22s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h1{font-size:28px;margin:6px 0 20px;letter-spacing:-.5px}

  .stats{display:flex;gap:8px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
    padding:12px 10px;text-align:center}
  .stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat span{font-size:11px;color:var(--dim2);letter-spacing:.4px}

  .unlock{border-radius:var(--r-md);padding:16px 17px;margin-bottom:16px;position:relative;overflow:hidden}
  .unlock .tag{font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
  .unlock h4{margin:6px 0 6px;font-size:16.5px}
  .unlock p{margin:0 0 13px;font-size:13.5px;line-height:1.55;color:#d3dae5}
  .unlock .row{display:flex;gap:8px}
  .unlock button{border:0;border-radius:var(--r-sm);padding:11px 15px;font-size:13.5px;
    font-weight:700;cursor:pointer;font-family:inherit}
  .unlock .go{flex:1;color:#0b0d11}
  .unlock .later{background:rgba(255,255,255,.07);color:#c9cfda}

  .lvl{display:block;width:100%;text-align:left;border:1px solid var(--line);
    background:var(--card);color:var(--txt);border-radius:var(--r-lg);padding:18px 52px 18px 20px;
    margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .14s ease, box-shadow .2s ease, border-color .2s ease}
  /* тапнатото ниво се "вдига" със сянка в собствения си цвят */
  .lvl:active{transform:scale(.985);border-color:color-mix(in srgb,var(--lc) 45%,var(--line));
    box-shadow:0 0 0 1px color-mix(in srgb,var(--lc) 30%,transparent),
               0 10px 34px -12px var(--lc)}
  .infoBtn{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;
    background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;
    font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;z-index:2}
  .infoBtn:active{transform:scale(.9)}
  .lvl .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  /* ежедневната рутина - без цветна лента, за да не се чете като ниво */
  .lvl.daily{background:linear-gradient(180deg,#141a24,#12151b);
    border-color:#2c3646;padding-left:20px}
  .lvl.daily h3::before{content:'';display:inline-block;width:7px;height:7px;
    border-radius:50%;background:#38bdf8;margin-right:8px;vertical-align:middle}
  .lvl h3{margin:0 0 5px;font-size:18px}
  .lvl p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.5}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.6px;
    padding:5px 11px;border-radius:var(--r-pill);margin-top:12px;text-transform:uppercase;
    border:1px solid}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .back{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    width:38px;height:38px;border-radius:var(--r-sm);font-size:19px;cursor:pointer;line-height:1}
  .top h2{font-size:20px;margin:0}

  .startBtn{width:100%;border:0;border-radius:var(--r-lg);padding:21px;font-size:18px;font-weight:800;
    letter-spacing:2px;cursor:pointer;font-family:inherit;color:#0b0d11;margin-bottom:24px;
    transition:transform .14s ease, box-shadow .2s ease}
  .startBtn:active{transform:scale(.985);box-shadow:0 10px 30px -12px currentColor}

  .planHead{color:var(--dim2);font-size:12px;letter-spacing:1.3px;text-transform:uppercase;margin:0 0 10px 2px}
  .step{display:flex;align-items:center;gap:13px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
    padding:14px 15px;margin-bottom:8px}
  .step .n{width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:#242a34;
    display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#cbd3e0}
  .step .t{flex:1;min-width:0}
  .step .t b{display:block;font-size:15px;font-weight:600}

  /* ---------- плеър ---------- */
  #player{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;
    padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 20px);
    max-width:480px;margin:0 auto;z-index:50}
  #player.on{display:flex}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .phead .x{background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;line-height:1;padding:0 4px}
  .ptitle{text-align:center;flex:1}
  .ptitle small{display:block;color:var(--dim);font-size:13px;margin-bottom:2px}
  .ptitle b{font-size:19px;font-weight:700;letter-spacing:-.2px}

  .wrap{flex:1;display:grid;place-items:center;position:relative;min-height:0}
  .stage{position:relative;width:min(88vw,350px);aspect-ratio:1}
  svg{width:100%;height:100%;display:block;overflow:visible}

  .center{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;gap:4px;padding:0 17%}
  #count{font-size:70px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-3px;line-height:1;color:#fff}
  #phase{font-size:14.5px;font-weight:700;line-height:1.25;text-align:center;
    letter-spacing:.5px;transition:color .35s ease}

  .bubbles{display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:16px;height:30px;overflow:hidden}
  .bub{font-size:13px;white-space:nowrap;color:#5b6473;transition:.3s;flex:0 0 auto}
  .bub.near{color:#7e8899}
  .bub.cur{color:var(--txt);font-weight:700;font-size:14.5px}

  .prog{height:3px;background:#1c212a;border-radius:var(--r-pill);overflow:hidden;margin-bottom:18px}
  .prog i{display:block;height:100%;width:0;border-radius:var(--r-pill);transition:width .2s linear}

  .pauseBtn{width:100%;border:0;border-radius:var(--r-pill);padding:19px;font-size:16px;font-weight:700;
    cursor:pointer;background:var(--card2);color:var(--txt);border:1px solid var(--line);font-family:inherit}
  .pauseBtn:active{transform:scale(.985)}

  /* ---------- край ---------- */
  #done{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;
    max-width:480px;margin:0 auto;z-index:60;text-align:center;padding:30px}
  #done.on{display:grid}
  /* наградата в края - по-плътен кръг със сияние */
  .check{width:92px;height:92px;border-radius:50%;background:rgba(34,197,94,.16);
    border:1.5px solid rgba(34,197,94,.5);
    box-shadow:0 0 0 8px rgba(34,197,94,.06), 0 14px 40px -10px rgba(34,197,94,.45);
    display:grid;place-items:center;margin:0 auto 24px;font-size:44px;color:#3ad675}
  #done h2{margin:0 0 8px;font-size:26px}
  #done p{color:var(--dim);margin:0 0 26px;font-size:14.5px;line-height:1.6}
  #done .pauseBtn{max-width:280px;margin:0 auto;background:#22c55e;color:#06210f;border-color:transparent}

  /* ---------- информация ---------- */
  #info{position:fixed;inset:0;background:rgba(4,5,7,.82);display:none;z-index:80;
    align-items:flex-end;justify-content:center;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #info.on{display:flex}
  .sheet{background:#12141a;border:1px solid var(--line);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    padding:22px 20px calc(var(--sb) + 22px);animation:up .25s ease}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .sheet .grab{width:38px;height:4px;border-radius:99px;background:#2c313b;margin:0 auto 18px}
  .sheet h3{margin:0 0 2px;font-size:21px}
  .sheet .lead{color:var(--dim);font-size:13.5px;margin:0 0 20px}
  .sec{margin-bottom:18px}
  .sec b{display:block;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--dim);margin-bottom:6px}
  .sec p{margin:0;font-size:14.5px;line-height:1.62}
  .sec.hi{background:var(--card2);border-radius:var(--r-md);padding:14px 15px}
  .sec.hi p{font-size:14.5px;font-weight:600}
  .sec.warn{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.34);
    border-radius:var(--r-md);padding:14px 15px}
  .sec.warn b{color:#fca5a5}
  .sec.warn p{color:#f0d6d6}   /* изсветлен, за да не потъва във фона */
  .bars{height:6px;border-radius:var(--r-pill);background:#272c36;overflow:hidden;margin-top:10px}
  .bars i{display:block;height:100%;border-radius:var(--r-pill)}
  .disc{color:#8891a1;font-size:12.5px;line-height:1.6;margin:20px 0 18px;
    border-top:1px solid var(--line);padding-top:16px}
  .sheet button{width:100%;border:0;border-radius:var(--r-pill);padding:17px;font-size:15px;
    font-weight:700;cursor:pointer;background:var(--card2);color:var(--txt);
    border:1px solid var(--line);font-family:inherit}

  /* ---------- банер ---------- */
  #a2hs{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);max-width:456px;
    margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
    padding:14px 16px;display:none;z-index:70;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #a2hs.on{display:block}
  #a2hs p{margin:0 0 6px;font-size:13.5px;line-height:1.5}
  #a2hs span{color:var(--dim);font-size:13px;line-height:1.5}
  #a2hs button{margin-top:10px;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:var(--r-sm);padding:8px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
</style>

<div id="app">
  <section id="s-levels" class="screen on">
    <h1>Kegel Trainer</h1>
    <div class="stats" id="stats"></div>
    <div id="unlock"></div>
    <div id="daily"></div>
    <p class="planHead" style="margin:22px 0 10px 2px">Програма по нива</p>
    <div id="levels"></div>
  </section>

  <section id="s-list" class="screen">
    <div class="top">
      <button class="back" onclick="go('s-levels')">‹</button>
      <h2 id="listTitle"></h2>
    </div>
    <button class="startBtn" id="startBtn" onclick="startSession()">СТАРТ</button>
    <p class="planHead">Дневна програма</p>
    <div id="planList"></div>
  </section>
</div>

<div id="player">
  <div class="phead">
    <span style="width:30px"></span>
    <div class="ptitle"><small id="pSmall">Остават 0:00</small><b id="pName"></b></div>
    <button class="x" onclick="quit()">✕</button>
  </div>

  <div class="wrap">
    <div class="stage">
      <svg viewBox="0 0 300 300">
        <defs>
          <filter id="blurBig" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="18"/>
          </filter>
          <filter id="blurMid" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="8"/>
          </filter>
        </defs>
        <circle id="glowOuter" cx="150" cy="150" r="120" fill="#ef4444" opacity=".16" filter="url(#blurBig)"/>
        <circle id="glowInner" cx="150" cy="150" r="100" fill="#ef4444" opacity=".24" filter="url(#blurMid)"/>
        <circle cx="150" cy="150" r="78" fill="#0d0f13"/>
        <circle cx="150" cy="150" r="78" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="4"/>
        <circle id="ring" cx="150" cy="150" r="78" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="4"
                stroke-linecap="round" transform="rotate(-90 150 150)"/>
      </svg>
      <div class="center">
        <div id="count">5</div>
        <div id="phase">ПРИГОТВИ СЕ</div>
      </div>
    </div>
  </div>

  <div class="bubbles" id="bubbles"></div>
  <div class="prog"><i id="progBar"></i></div>
  <button class="pauseBtn" id="btnPause" onclick="togglePause()">❚❚ Пауза</button>
</div>

<div id="done">
  <div>
    <div class="check">✓</div>
    <h2>Готово за днес!</h2>
    <p id="doneTxt"></p>
    <button class="pauseBtn" onclick="closeDone()">Назад</button>
  </div>
</div>

<div id="info" onclick="if(event.target===this)closeInfo()">
  <div class="sheet" id="sheet"></div>
</div>

<div id="a2hs">
  <p><b>Добави Kegel на началния екран</b></p>
  <span>Натисни <b>Сподели</b> ⬆️ долу в Safari → <b>Add to Home Screen</b>. После се отваря на цял екран като истинско приложение и работи без интернет.</span>
  <button onclick="document.getElementById('a2hs').classList.remove('on')">Разбрах</button>
</div>

<script>
/* =====================================================================
   ФАЗИ - всяка с изрично зададена продължителност. Няма формула за
   възстановяване: това, което е записано тук, е това, което върви.

     C  (t:'c')  свий навътре
     H  (t:'h')  задръж свиването
     REL(t:'r')  отпусни след усилието      -> надпис ОТПУСНИ
     X  (t:'x')  натисни навън (обратен кегел)
     XH (t:'xh') задръж натиска навън
     ---
     t:'xrest'   почивка МЕЖДУ упражненията -> надпис ПОЧИВКА
     t:'prep'    приготвяне в началото

   Отпускането е максимум 5 сек навсякъде. Единственото изключение е
   "Контрол с дишане" с 6 сек, защото там отпускането е самото издишване.
   Обявеното време на нивото включва всичко: приготвяне, свивания,
   задържания, отпускания и почивките между упражненията.
   ===================================================================== */
const C =d=>({t:'c', d});
const H =d=>({t:'h', d});
/* Задържане, при което кръгът се изпълва за първите ramp секунди и после
   стои пълен. Надписът е само ЗАДРЪЖ, а таймерът брои цялото време. */
const HR=(d,ramp)=>({t:'h', d, ramp:ramp||1});
const REL=d=>({t:'r', d});
const X =d=>({t:'x', d});
const XH=d=>({t:'xh',d});

const RED='#ef4444', GREEN='#22c55e', BLUE='#38bdf8', VIOLET='#a78bfa';
const COLOR={c:RED,h:RED,x:VIOLET,xh:VIOLET,r:GREEN,prep:BLUE,xrest:BLUE};
const PREP=5;


/* По-плътни за работните фази, меки за отпускането и почивките. */
const GLOW={
  c:[.30,.21], h:[.36,.26], x:[.30,.21], xh:[.34,.24],
  r:[.20,.13], prep:[.12,.07], xrest:[.12,.07],
};

const LEVELS=[
 {id:1,name:'Начинаещ',color:'#22c55e',work:240,goal:[14,21],exRest:10,
  desc:'Техника и изолация на мускула. Легнало положение, спокойно дишане.',
  ex:[
   {name:'Основно свиване',  cycle:[C(3),REL(5)],           reps:5, note:'свий 3с · отпусни 5с'},
   {name:'Бързи импулси',    cycle:[C(1),REL(1)], fast:true,reps:7, note:'1с свий · 1с отпусни'},
   {name:'Кратко задържане', cycle:[C(2),H(4),REL(5)],      reps:5, note:'свий 2с · задръж 4с · отпусни 5с'},
   {name:'Контрол с дишане', cycle:[C(3),H(5),REL(6)],      reps:4, note:'свий 3с · задръж 5с · отпусни 6с с издишване'},
   {name:'Обратен кегел',    cycle:[X(2),XH(3),REL(5)],     reps:3, note:'натисни навън 2с · задръж 3с · върни се 5с'},
  ]},
 {id:2,name:'Напреднал',color:'#f59e0b',work:360,goal:[28,42],exRest:15,
  desc:'Сила и издръжливост. Седнало или изправено, по-къси паузи.',
  ex:[
   {name:'Стълба',
    cycles:[[C(2),H(4),REL(4)],[C(2),H(6),REL(4)],[C(2),H(8),REL(5)],
            [C(2),H(6),REL(4)],[C(2),H(4),REL(4)]], reps:1, note:'задържане 4-6-8-6-4с · отпускане 4-5с'},
   {name:'Средно задържане', cycle:[C(2),H(7),REL(4)],      reps:5, note:'свий 2с · задръж 7с · отпусни 4с'},
   {name:'Пулсиране',        cycle:[C(1),REL(1)], fast:true,reps:8, note:'1с свий · 1с отпусни'},
   {name:'Издръжливост',     cycle:[C(2),H(10),REL(5)],     reps:7, note:'свий 2с · задръж 10с · отпусни 5с'},
   {name:'Обратен кегел',    cycle:[X(2),XH(3),REL(4)],     reps:4, note:'натисни навън 2с · задръж 3с · върни се 4с'},
  ]},
 {id:3,name:'Експерт',color:'#ef4444',work:480,goal:[0,0],exRest:15,
  desc:'Поддържане и контрол. Изправено положение, без удължаване на задържанията.',
  ex:[
   {name:'Бърза серия',      cycle:[C(1),REL(1)], fast:true,reps:14,note:'1с свий · 1с отпусни'},
   {name:'Дълго задържане',  cycle:[C(2),H(12),REL(5)],     reps:7, note:'свий 2с · задръж 12с · отпусни 5с'},
   {name:'Асансьор',         cycle:[C(2),H(4),C(2),H(4),C(2),H(4),REL(5)], reps:4,
    note:'три стъпала по 2с свиване + 4с задържане · отпусни 5с'},
   {name:'Максимална издръжливост',cycle:[C(3),H(15),REL(5)],reps:6,note:'свий 3с · задръж 15с · отпусни 5с'},
   {name:'Обратен кегел',    cycle:[X(2),XH(3),REL(3)],     reps:3, note:'натисни навън 2с · задръж 3с · върни се 3с'},
  ]},
];

/* ---------- ЕЖЕДНЕВНА РУТИНА ----------
   Кратка последователност, независима от нивата. Може да се прави по всяко
   време на деня. Времената са фиксирани и точни:

     част 1   свий 2с + отпусни 2с        x10  =  40с
     почивка                                   =  30с
     част 2   задръж 5с + отпусни 2с      x10  =  70с
     част 3   свий 0.5с + отпусни 0.5с    x10  =  10с
     ----------------------------------------------
     рутина                                     = 150с (2:30)

   Част 2 е ЕДНА фаза от 5 секунди с надпис ЗАДРЪЖ. Кръгът се изпълва
   докрай през първата секунда и стои пълен останалите четири - свиването
   е бързо, задържането е дълго.

   Част 3 е "приблизително веднъж в секунда" - това е ЦЯЛ цикъл свиване и
   отпускане за една секунда, тоест по половин секунда всяко. Само така
   сборът дава заявените 2 минути и 30 секунди.

const $=id=>document.getElementById(id);

function labelFor(p){
  if(p.t==='prep')  return 'ПРИГОТВИ СЕ';
  if(p.t==='xrest') return 'ПОЧИВКА';
  if(p.t==='r')     return 'ОТПУСНИ';
  if(p.t==='h')     return 'ЗАДРЪЖ';
  if(p.t==='c')     return 'СТЕГНИ';
  if(p.t==='x')     return 'НАТИСНИ НАВЪН';
  if(p.t==='xh')    return 'ЗАДРЪЖ НАВЪН';
  return '';
}

/* Връща фазите точно както са зададени - без изчисления. */
const cyclesOf=e=>e.cycles||[e.cycle];
const unitOf=e=>cyclesOf(e).reduce((a,c)=>a+c.reduce((x,p)=>x+p.d,0),0);
const exTime=e=>unitOf(e)*e.reps;

function blocksFor(level){
  const out=[];
  level.ex.forEach((e,i)=>{
    if(i>0) out.push({type:'rest',name:'Почивка',d:level.exRest});
    out.push({type:'ex',name:e.name,ex:e,d:exTime(e),
              reps:e.reps*cyclesOf(e).length,note:e.note});
  });
  return out;
}

function markRingGroups(q){
  let i=0;
  while(i<q.length){
    const p=q[i];
    if(p.fast&&(p.t==='c'||p.t==='r')){
      let j=i,tot=0;
      while(j<q.length&&q[j].fast&&(q[j].t==='c'||q[j].t==='r')){tot+=q[j].d;j++;}
      let off=0;
      for(let k=i;k<j;k++){q[k].rgOff=off;q[k].rgTot=tot;off+=q[k].d;}
      i=j;
    }else{ p.rgOff=0; p.rgTot=p.d; i++; }
  }
  return q;
}

function sessionFor(blocks){
  const q=[{t:'prep',d:PREP,block:-1}];
  blocks.forEach((b,bi)=>{
    if(b.type==='rest'){ q.push({t:'xrest',d:b.d,block:bi}); return; }
    const e=b.ex, cys=cyclesOf(e);
    for(let n=0;n<e.reps;n++)
      cys.forEach(c=>c.forEach(p=>q.push({t:p.t,d:p.d,ramp:p.ramp,block:bi,fast:!!e.fast})));
  });
  q.forEach(p=>{p.l=labelFor(p)});
  return markRingGroups(q);
}
const sessionTime=blocks=>sessionFor(blocks).reduce((a,p)=>a+p.d,0);

/* Проверка: обявеното време трябва да съвпада точно. Ако някога не съвпадне,
   се коригират ПОВТОРЕНИЯТА в LEVELS, никога клиничните времена на фазите. */
(function verifyTimes(){
  LEVELS.forEach(l=>{
    const t=sessionTime(blocksFor(l));
    if(t!==l.work) console.warn('Kegel: '+l.name+' дава '+t+'с вместо '+l.work+'с - коригирай reps.');
  });
})();

const LOGKEY='kegel-log-v1', SEENKEY='kegel-unlock-seen';
function loadLog(){ try{return JSON.parse(localStorage.getItem(LOGKEY))||[]}catch(e){return []} }
function saveLog(l){ try{localStorage.setItem(LOGKEY,JSON.stringify(l))}catch(e){} }
function dayStr(off){
  const d=new Date(); d.setDate(d.getDate()+(off||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function logToday(levelId){
  const log=loadLog(), today=dayStr(0);
  if(!log.some(e=>e.d===today&&e.l===levelId)) log.push({d:today,l:levelId});
  saveLog(log);
}
function stats(){
  const log=loadLog();
  const days=[...new Set(log.map(e=>e.d))].sort();
  let streak=0;
  if(days.length){
    let cur=days.includes(dayStr(0))?0:(days.includes(dayStr(-1))?-1:null);
    while(cur!==null&&days.includes(dayStr(cur))){streak++;cur--;}
  }
  return {total:days.length,streak,log};
}
const levelCount=id=>[...new Set(loadLog().filter(e=>e.l===id).map(e=>e.d))].length;

function unlockCheck(){
  for(const l of LEVELS){
    const next=LEVELS.find(x=>x.id===l.id+1);
    if(!next||!l.goal[0])continue;
    if(levelCount(l.id)>=l.goal[0] && levelCount(next.id)===0)
      return {from:l,to:next,done:levelCount(l.id)};
  }
  return null;
}
function seenUnlock(){ try{return localStorage.getItem(SEENKEY)}catch(e){return null} }
function markSeen(k){ try{localStorage.setItem(SEENKEY,k)}catch(e){} }

function renderStats(){

/* ================= ПЛЕЪР ================= */
let blocks=[],queue=[],idx=0,elapsed=0,total=0,before=0,paused=false,raf=null,last=0,wake=null;
const RING_R=78, C2=2*Math.PI*RING_R;
$('ring').style.strokeDasharray=C2;
const GMIN=84, GMAX=142;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function startSession(){
  blocks=curBlocks;
  queue=sessionFor(blocks);
  idx=0; elapsed=0; before=0; paused=false;
  total=queue.reduce((a,p)=>a+p.d,0);
  $('btnPause').textContent='❚❚ Пауза';
  $('bubbles').dataset.k='';
  $('progBar').style.background=curLevel.color;
  $('player').classList.add('on');
  requestWake();
  render(); last=performance.now(); raf=requestAnimationFrame(loop);
}

function loop(now){
  const dt=Math.min((now-last)/1000,.5); last=now;
  if(!paused){
    elapsed+=dt;
    while(elapsed>=queue[idx].d){
      elapsed-=queue[idx].d; before+=queue[idx].d; idx++;
      if(idx>=queue.length) return finish();
      buzz(queue[idx].t);
    }
  }
  render();
  raf=requestAnimationFrame(loop);
}

function render(){
  const ph=queue[idx], col=COLOR[ph.t];
  const rgElapsed=(ph.rgOff||0)+elapsed, rgTotal=ph.rgTot||ph.d;
  const ringP=Math.min(rgElapsed/rgTotal,1);
  const ringLeft=Math.max(0,rgTotal-rgElapsed);

  const resting=(ph.t==='xrest'||ph.t==='prep');
  $('count').textContent=Math.ceil(ringLeft-0.001)||0;
  $('count').style.color=resting?BLUE:'#fff';
  $('phase').textContent=ph.l;
  $('phase').style.color=col;
  $('ring').setAttribute('stroke',resting?BLUE:'#ffffff');
  $('ring').style.strokeDashoffset=C2*(1-ringP);

  const p=Math.min(elapsed/ph.d,1);
  let g;
  if(ph.t==='c')       g=GMIN+(GMAX-GMIN)*ease(p);
  /* задържане с бързо изпълване: кръгът се разгръща за ph.ramp секунди,
     после стои пълен и само тупти - надписът през цялото време е ЗАДРЪЖ */
  else if(ph.t==='h'&&ph.ramp&&elapsed<ph.ramp)
                       g=GMIN+(GMAX-GMIN)*ease(elapsed/ph.ramp);
  else if(ph.t==='h')  g=GMAX-5+7*Math.abs(Math.cos((elapsed-(ph.ramp||0))*2.4));
  else if(ph.t==='x')  g=GMIN+(GMAX-GMIN)*p;
  else if(ph.t==='xh') g=GMAX-3+4*Math.sin(elapsed*1.2);
  else if(ph.t==='r')  g=GMAX-(GMAX-GMIN)*ease(p);
  else                 g=GMIN-8+5*Math.sin(elapsed*1.4);

  const gi=$('glowInner'), go_=$('glowOuter');
  const [oi,oo]=GLOW[ph.t]||[.24,.16];
  gi.setAttribute('r',g.toFixed(1));
  go_.setAttribute('r',(g*1.2).toFixed(1));
  gi.setAttribute('fill',col); go_.setAttribute('fill',col);
  gi.setAttribute('opacity',oi); go_.setAttribute('opacity',oo);

  const done=before+elapsed;
  $('pSmall').textContent='Остават '+fmt(Math.max(0,total-done));
  $('pName').textContent=ph.block>=0&&blocks[ph.block]?blocks[ph.block].name:curLevel.name;
  $('progBar').style.width=(done/total*100)+'%';
  renderBubbles(ph.block);
}

function renderBubbles(bi){
  const b=$('bubbles');
  if(b.dataset.k===String(bi))return;
  b.dataset.k=String(bi);
  const cur=Math.max(0,bi);
  const from=Math.max(0,cur-2), to=Math.min(blocks.length-1,cur+2);
  let html='';
  for(let i=from;i<=to;i++){
    const dist=Math.abs(i-cur);
    html+=`<span class="${dist===0?'bub cur':dist===1?'bub near':'bub'}">${blocks[i].name}</span>`;
  }
  b.innerHTML=html;
}

/* вибрация - работи на Android, на iPhone Safari я няма и просто не прави нищо */
function buzz(t){
  if(!navigator.vibrate)return;
  try{
    if(t==='c')navigator.vibrate([60]);
    else if(t==='h')navigator.vibrate([30,60,30]);
    else if(t==='x')navigator.vibrate([40,40,40]);
    else if(t==='xh')navigator.vibrate([20,50,20,50,20]);
    else if(t==='r')navigator.vibrate([80]);
    else navigator.vibrate([25]);
  }catch(e){}
}

function togglePause(){
  paused=!paused;
  $('btnPause').textContent=paused?'▶ Продължи':'❚❚ Пауза';
  if(!paused){last=performance.now();requestWake()}
}
function quit(){cancelAnimationFrame(raf);$('player').classList.remove('on');releaseWake()}
function finish(){
  cancelAnimationFrame(raf); $('player').classList.remove('on'); releaseWake();
  if(navigator.vibrate)try{navigator.vibrate([80,60,80])}catch(e){}
  logToday(curLevel.id);
  const s=stats(), n=levelCount(curLevel.id), u=unlockCheck();
  const goal=curLevel.goal[1]?` · ${n} от ${curLevel.goal[0]}-${curLevel.goal[1]} дни`:'';
  let extra='';
  if(u&&u.from.id===curLevel.id)
    extra=`<br><span style="color:${u.to.color};font-weight:700">Отключи ниво ${u.to.name}</span>`;
  $('doneTxt').innerHTML=
    `${curLevel.name} · ${fmt(total)} мин<br>`+
    `<span style="color:#22c55e;font-weight:700">${s.streak} поредни дни</span>${goal}${extra}`;
  renderStats();
  $('done').classList.add('on');
}
function closeDone(){$('done').classList.remove('on');go('s-levels')}

/* --- екранът да не заспива --- */
async function requestWake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ wake=null; if($('player').classList.contains('on')&&!paused)togglePause(); }
});

/* --- iOS --- */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(isIOS&&!standalone){setTimeout(()=>$('a2hs').classList.add('on'),1200)}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

renderStats();

/* --- офлайн --- */
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</html>
