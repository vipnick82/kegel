<!DOCTYPE html>
<html lang="bg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kegel Trainer</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kegel">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
  :root{
    --bg:#08090c; --card:#111318; --card2:#171a21; --line:#22262f;
    --txt:#f2f4f8; --dim:#8b93a3; --accent:#ef4444;
    --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
  .screen{display:none;padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 40px);animation:fade .22s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.5px}
  .sub{color:var(--dim);font-size:14px;margin:0 0 22px}

  .lvl{display:block;width:100%;text-align:left;border:1px solid var(--line);
    background:var(--card);color:var(--txt);border-radius:18px;padding:18px;
    margin-bottom:12px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .lvl:active{transform:scale(.985)}
  .lvl .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .lvl h3{margin:0 0 4px;font-size:18px}
  .lvl p{margin:0;color:var(--dim);font-size:13px;line-height:1.45}
  .pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;
    padding:4px 9px;border-radius:99px;margin-top:10px;text-transform:uppercase}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .back{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    width:38px;height:38px;border-radius:12px;font-size:19px;cursor:pointer;line-height:1}
  .top h2{font-size:20px;margin:0}

  .startBtn{width:100%;border:0;border-radius:18px;padding:20px;font-size:17px;font-weight:700;
    cursor:pointer;font-family:inherit;color:#0b0d11;margin-bottom:24px}
  .startBtn:active{transform:scale(.985)}
  .startBtn small{display:block;font-size:12.5px;font-weight:600;opacity:.72;margin-top:3px}

  .planHead{color:var(--dim);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin:0 0 10px 2px}
  .step{display:flex;align-items:center;gap:13px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-bottom:8px}
  .step .n{width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:var(--card2);
    display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--dim)}
  .step .t{flex:1;min-width:0}
  .step .t b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
  .step .t span{font-size:12px;color:var(--dim)}

  /* ---------- плеър ---------- */
  #player{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;
    padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 20px);
    max-width:480px;margin:0 auto;z-index:50}
  #player.on{display:flex}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .phead .x{background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;line-height:1;padding:0 4px}
  .ptitle{text-align:center;flex:1}
  .ptitle small{display:block;color:var(--dim);font-size:12.5px;margin-bottom:2px}
  .ptitle b{font-size:19px;font-weight:700;letter-spacing:-.2px}

  .wrap{flex:1;display:grid;place-items:center;position:relative;min-height:0}
  .stage{position:relative;width:min(88vw,350px);aspect-ratio:1}
  svg{width:100%;height:100%;display:block;overflow:visible}

  .center{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;gap:4px;padding:0 22%}
  #count{font-size:70px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-3px;line-height:1;color:#fff}
  #phase{font-size:14px;font-weight:600;line-height:1.25;text-align:center;
    transition:color .35s ease}

  .bubbles{display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:16px;height:30px;overflow:hidden}
  .bub{font-size:13px;white-space:nowrap;color:#4b5563;transition:.3s;flex:0 0 auto}
  .bub.near{color:#6b7280}
  .bub.cur{color:var(--txt);font-weight:700;font-size:14.5px}

  .prog{height:3px;background:#1a1e26;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .prog i{display:block;height:100%;width:0;border-radius:99px;transition:width .2s linear}

  .pauseBtn{width:100%;border:0;border-radius:99px;padding:19px;font-size:16px;font-weight:700;
    cursor:pointer;background:var(--card2);color:var(--txt);border:1px solid var(--line);font-family:inherit}
  .pauseBtn:active{transform:scale(.985)}

  /* ---------- край ---------- */
  #done{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;
    max-width:480px;margin:0 auto;z-index:60;text-align:center;padding:30px}
  #done.on{display:grid}
  .check{width:88px;height:88px;border-radius:50%;background:rgba(34,197,94,.14);
    display:grid;place-items:center;margin:0 auto 22px;font-size:42px;color:#22c55e}
  #done h2{margin:0 0 8px;font-size:26px}
  #done p{color:var(--dim);margin:0 0 26px;font-size:14px;line-height:1.6}
  #done .pauseBtn{max-width:280px;margin:0 auto;background:#22c55e;color:#06210f;border-color:transparent}

  /* ---------- банер ---------- */
  #a2hs{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);max-width:456px;
    margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;display:none;z-index:70;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #a2hs.on{display:block}
  #a2hs p{margin:0 0 6px;font-size:13.5px;line-height:1.5}
  #a2hs span{color:var(--dim);font-size:12.5px}
  #a2hs button{margin-top:10px;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:8px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
</style>

<div id="app">
  <section id="s-levels" class="screen on">
    <h1>Kegel Trainer</h1>
    <p class="sub">Тренировка на тазовото дъно. Избери ниво за днес.</p>
    <div id="levels"></div>
  </section>

  <section id="s-list" class="screen">
    <div class="top">
      <button class="back" onclick="go('s-levels')">‹</button>
      <h2 id="listTitle"></h2>
    </div>
    <button class="startBtn" id="startBtn" onclick="startSession()"></button>
    <p class="planHead">Дневна програма</p>
    <div id="planList"></div>
  </section>
</div>

<div id="player">
  <div class="phead">
    <span style="width:30px"></span>
    <div class="ptitle"><small id="pSmall">Остават 0:00</small><b id="pName"></b></div>
    <button class="x" onclick="quit()">✕</button>
  </div>

  <div class="wrap">
    <div class="stage">
      <svg viewBox="0 0 300 300">
        <defs>
          <filter id="blurBig" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="18"/>
          </filter>
          <filter id="blurMid" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="8"/>
          </filter>
        </defs>
        <circle id="glowOuter" cx="150" cy="150" r="120" fill="#ef4444" opacity=".16" filter="url(#blurBig)"/>
        <circle id="glowInner" cx="150" cy="150" r="100" fill="#ef4444" opacity=".24" filter="url(#blurMid)"/>
        <circle cx="150" cy="150" r="78" fill="#0d0f13"/>
        <circle cx="150" cy="150" r="78" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="4"/>
        <circle id="ring" cx="150" cy="150" r="78" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="4"
                stroke-linecap="round" transform="rotate(-90 150 150)"/>
      </svg>
      <div class="center">
        <div id="count">5</div>
        <div id="phase">ПРИГОТВИ СЕ</div>
      </div>
    </div>
  </div>

  <div class="bubbles" id="bubbles"></div>
  <div class="prog"><i id="progBar"></i></div>
  <button class="pauseBtn" id="btnPause" onclick="togglePause()">❚❚ Пауза</button>
</div>

<div id="done">
  <div>
    <div class="check">✓</div>
    <h2>Готово за днес!</h2>
    <p id="doneTxt"></p>
    <button class="pauseBtn" onclick="closeDone()">Назад</button>
  </div>
</div>

<div id="a2hs">
  <p><b>Добави Kegel на началния екран</b></p>
  <span>Натисни <b>Сподели</b> ⬆️ долу в Safari → <b>Add to Home Screen</b>. После се отваря на цял екран като истинско приложение и работи без интернет.</span>
  <button onclick="document.getElementById('a2hs').classList.remove('on')">Разбрах</button>
</div>

<script>
/* ============ ДАННИ ============
   c = свий, h = задръж, r = отпусни, p = кратка почивка вътре в упражнението.
   fast:true  -> серия от бързи импулси. При такива упражнения бялата лента и
   цифрата отчитат цялата серия до почивката, а не всяко отделно свиване.
   restAfter  -> почивка след упражнението, съобразена с тежестта му.          */
const P={ c:(d)=>({t:'c',d}), h:(d)=>({t:'h',d}), r:(d)=>({t:'r',d}), p:(d)=>({t:'p',d}) };
const RED='#ef4444', GREEN='#22c55e', GREY='#5b6472';
const COLOR={c:RED,h:RED,r:GREEN,p:GREY,prep:GREY,xrest:GREY};

const LEVELS=[
 {id:1,name:'Начинаещ',color:'#22c55e',
  desc:'Учиш се да намираш и контролираш мускула. Кратки свивания, дълги почивки.',
  ex:[
   {name:'Основно свиване',   cycle:[P.c(3),P.p(3)],              reps:8,  restAfter:25},
   {name:'Бързи импулси',     cycle:[P.c(1),P.r(1)],  fast:true,  reps:14, restAfter:30},
   {name:'Кратко задържане',  cycle:[P.c(2),P.h(3),P.r(2),P.p(5)],reps:5,  restAfter:40},
   {name:'Контрол с дишане',  cycle:[P.c(4),P.h(2),P.r(4),P.p(6)],reps:4},
  ]},
 {id:2,name:'Напреднал',color:'#f59e0b',
  desc:'По-дълги задържания и по-плътно натоварване. Изгражда сила и издръжливост.',
  ex:[
   {name:'Средно задържане',  cycle:[P.c(2),P.h(6),P.r(2),P.p(6)],  reps:7, restAfter:40},
   {name:'Пулсиране',         cycle:[P.c(1),P.r(1)],   fast:true,   reps:22,restAfter:40},
   {name:'Стълба',
    cycles:[[P.c(2),P.h(3),P.r(2),P.p(5)],[P.c(2),P.h(5),P.r(2),P.p(5)],
            [P.c(2),P.h(7),P.r(2),P.p(6)],[P.c(2),P.h(5),P.r(2),P.p(5)],
            [P.c(2),P.h(3),P.r(2),P.p(5)]], restAfter:45},
   {name:'Издръжливост 10 сек',cycle:[P.c(2),P.h(10),P.r(3),P.p(10)],reps:5},
  ]},
 {id:3,name:'Експерт',color:'#ef4444',
  desc:'Максимална издръжливост и прецизен контрол. Само след стабилно второ ниво.',
  ex:[
   {name:'Дълго задържане',   cycle:[P.c(2),P.h(15),P.r(3),P.p(10)],reps:4, restAfter:55},
   {name:'Асансьор',          cycle:[P.c(2),P.h(5),P.c(2),P.h(5),P.c(2),P.h(5),P.r(5),P.p(12)],reps:3,restAfter:60},
   {name:'Бърза серия',       cycle:[P.c(1),P.r(1)],   fast:true,   reps:32,restAfter:42},
   {name:'Максимална издръжливост',cycle:[P.c(3),P.h(20),P.r(4),P.p(8)],reps:4},
  ]},
];

/* ============ ПОМОЩНИ ============ */
const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
const cyclesOf=e=>e.cycles||Array.from({length:e.reps},()=>e.cycle);

function labelFor(phase,next){
  if(phase.t==='prep')  return 'ПРИГОТВИ СЕ';
  if(phase.t==='xrest'||phase.t==='p') return 'ПОЧИВКА';
  if(phase.t==='r')     return 'ОТПУСНИ';
  if(phase.t==='h')     return 'СВИЙ И ЗАДРЪЖ';
  if(phase.t==='c')     return (next&&next.t==='h')?'СВИЙ И ЗАДРЪЖ':'СВИЙ';
  return '';
}

function buildQueue(e,block){
  const q=[]; const cy=cyclesOf(e), sets=e.sets||1;
  for(let s=0;s<sets;s++){
    cy.forEach(c=>c.forEach(p=>q.push({...p,block,fast:!!e.fast})));
    if(s<sets-1) q.push({t:'p',d:e.setRest||30,block});
  }
  return q;
}
const exTime=e=>buildQueue(e,0).reduce((a,p)=>a+p.d,0);

function buildPlan(level){
  const blocks=[];
  level.ex.forEach((e,i)=>{
    if(i>0) blocks.push({type:'rest',name:'Почивка',d:level.ex[i-1].restAfter||40});
    blocks.push({type:'ex',name:e.name,ex:e,d:exTime(e),reps:cyclesOf(e).length*(e.sets||1)});
  });
  return blocks;
}

/* Групиране за лентата: при бързите серии всички последователни свивания и
   отпускания се броят като един отрязък, така че лентата минава веднъж
   до почивката, вместо да се презарежда на всеки импулс. */
function markRingGroups(q){
  let i=0;
  while(i<q.length){
    const p=q[i];
    if(p.fast&&(p.t==='c'||p.t==='r')){
      let j=i, tot=0;
      while(j<q.length&&q[j].fast&&(q[j].t==='c'||q[j].t==='r')){tot+=q[j].d;j++;}
      let off=0;
      for(let k=i;k<j;k++){ q[k].rgOff=off; q[k].rgTot=tot; off+=q[k].d; }
      i=j;
    }else{
      p.rgOff=0; p.rgTot=p.d; i++;
    }
  }
  return q;
}

function buildSession(blocks){
  const q=[{t:'prep',d:5,block:-1}];
  blocks.forEach((b,bi)=>{
    if(b.type==='rest') q.push({t:'xrest',d:b.d,block:bi});
    else buildQueue(b.ex,bi).forEach(p=>q.push(p));
  });
  q.forEach((p,i)=>{ p.l=labelFor(p,q[i+1]); });
  return markRingGroups(q);
}
const planTime=level=>buildSession(buildPlan(level)).reduce((a,p)=>a+p.d,0);

/* ============ ЕКРАНИ ============ */
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

$('levels').innerHTML=LEVELS.map(l=>`
  <button class="lvl" onclick="openLevel(${l.id})">
    <span class="bar" style="background:${l.color}"></span>
    <h3>${l.name}</h3>
    <p>${l.desc}</p>
    <span class="pill" style="background:${l.color}22;color:${l.color}">
      ${l.ex.length} упражнения · ${fmt(planTime(l))} мин
    </span>
  </button>`).join('');

let curLevel=null, curPlan=[];
function openLevel(id){
  curLevel=LEVELS.find(l=>l.id===id);
  curPlan=buildPlan(curLevel);
  $('listTitle').textContent=curLevel.name;
  document.documentElement.style.setProperty('--accent',curLevel.color);
  $('startBtn').style.background=curLevel.color;
  $('startBtn').innerHTML=`Започни дневната програма
    <small>${curLevel.ex.length} упражнения · ${fmt(planTime(curLevel))} мин общо</small>`;

  $('planList').innerHTML=curLevel.ex.map((e,i)=>`
    <div class="step">
      <span class="n">${i+1}</span>
      <span class="t"><b>${e.name}</b><span>${cyclesOf(e).length*(e.sets||1)} повторения · ${fmt(exTime(e))} мин</span></span>
    </div>`).join('');
  go('s-list');
}

/* ============ ПЛЕЪР ============ */
let blocks=[],queue=[],idx=0,elapsed=0,total=0,before=0,paused=false,raf=null,last=0,wake=null;
const RING_R=78;
const C=2*Math.PI*RING_R;
$('ring').style.strokeDasharray=C;

const GMIN=84, GMAX=142;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function startSession(){
  blocks=curPlan;
  queue=buildSession(blocks);
  idx=0; elapsed=0; before=0; paused=false;
  total=queue.reduce((a,p)=>a+p.d,0);
  $('btnPause').textContent='❚❚ Пауза';
  $('bubbles').dataset.k='';
  $('progBar').style.background=curLevel.color;
  $('player').classList.add('on');
  requestWake();
  render(); last=performance.now(); raf=requestAnimationFrame(loop);
}

function loop(now){
  const dt=Math.min((now-last)/1000,.5); last=now;
  if(!paused){
    elapsed+=dt;
    while(elapsed>=queue[idx].d){
      elapsed-=queue[idx].d; before+=queue[idx].d; idx++;
      if(idx>=queue.length) return finish();
      buzz(queue[idx].t);
    }
  }
  render();
  raf=requestAnimationFrame(loop);
}

function render(){
  const ph=queue[idx];
  const col=COLOR[ph.t];

  /* лентата и цифрата: за бързите серии - целият отрязък до почивката,
     иначе - самата фаза */
  const rgElapsed=(ph.rgOff||0)+elapsed;
  const rgTotal=ph.rgTot||ph.d;
  const ringP=Math.min(rgElapsed/rgTotal,1);
  const ringLeft=Math.max(0,rgTotal-rgElapsed);

  $('count').textContent=Math.ceil(ringLeft-0.001)||0;
  $('phase').textContent=ph.l;
  $('phase').style.color=col;
  $('ring').style.strokeDashoffset=C*(1-ringP);

  /* сиянието винаги следва темпото на текущата фаза - при бързите импулси
     то продължава да пулсира на всяко свиване, само лентата е спокойна */
  const p=Math.min(elapsed/ph.d,1);
  let g;
  if(ph.t==='c')      g=GMIN+(GMAX-GMIN)*ease(p);
  else if(ph.t==='h') g=GMAX+3*Math.sin(elapsed*6);
  else if(ph.t==='r') g=GMAX-(GMAX-GMIN)*ease(p);
  else                g=GMIN-8+5*Math.sin(elapsed*1.4);

  const gi=$('glowInner'), go_=$('glowOuter');
  gi.setAttribute('r',g.toFixed(1));
  go_.setAttribute('r',(g*1.2).toFixed(1));
  gi.setAttribute('fill',col);
  go_.setAttribute('fill',col);
  const calm=(ph.t==='p'||ph.t==='prep'||ph.t==='xrest');
  gi.setAttribute('opacity',(calm?.12:ph.t==='h'?.32:.24).toFixed(2));
  go_.setAttribute('opacity',(calm?.07:ph.t==='h'?.22:.16).toFixed(2));

  const done=before+elapsed;
  $('pSmall').textContent='Остават '+fmt(Math.max(0,total-done));
  $('pName').textContent=ph.block>=0&&blocks[ph.block]?blocks[ph.block].name:curLevel.name;
  $('progBar').style.width=(done/total*100)+'%';
  renderBubbles(ph.block);
}

function renderBubbles(bi){
  const b=$('bubbles');
  if(b.dataset.k===String(bi))return;
  b.dataset.k=String(bi);
  const cur=Math.max(0,bi);
  const from=Math.max(0,cur-2), to=Math.min(blocks.length-1,cur+2);
  let html='';
  for(let i=from;i<=to;i++){
    const dist=Math.abs(i-cur);
    html+=`<span class="${dist===0?'bub cur':dist===1?'bub near':'bub'}">${blocks[i].name}</span>`;
  }
  b.innerHTML=html;
}

/* вибрация - работи на Android, на iPhone Safari я няма и просто не прави нищо */
function buzz(t){
  if(!navigator.vibrate)return;
  try{
    if(t==='c')navigator.vibrate([60]);
    else if(t==='h')navigator.vibrate([30,60,30]);
    else if(t==='r')navigator.vibrate([80]);
    else navigator.vibrate([25]);
  }catch(e){}
}

function togglePause(){
  paused=!paused;
  $('btnPause').textContent=paused?'▶ Продължи':'❚❚ Пауза';
  if(!paused){last=performance.now();requestWake()}
}
function quit(){cancelAnimationFrame(raf);$('player').classList.remove('on');releaseWake()}
function finish(){
  cancelAnimationFrame(raf); $('player').classList.remove('on'); releaseWake();
  if(navigator.vibrate)try{navigator.vibrate([80,60,80])}catch(e){}
  $('doneTxt').textContent=`${curLevel.name} · ${curLevel.ex.length} упражнения · ${fmt(total)} мин`;
  $('done').classList.add('on');
}
function closeDone(){$('done').classList.remove('on')}

/* --- екранът да не заспива --- */
async function requestWake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ wake=null; if($('player').classList.contains('on')&&!paused)togglePause(); }
});

/* --- iOS --- */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(isIOS&&!standalone){setTimeout(()=>$('a2hs').classList.add('on'),1200)}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* --- офлайн --- */
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</html>
